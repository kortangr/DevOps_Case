name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: >-
            mern-project/client/package-lock.json

      - name: Install dependencies
        working-directory: mern-project/client
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: npm ci

      - name: Build
        working-directory: mern-project/client
        run: npm run build

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: >-
            mern-project/server/package-lock.json

      - name: Install dependencies
        working-directory: mern-project/server
        run: npm ci

      - name: Syntax check
        working-directory: mern-project/server
        run: |
          node --check server.mjs
          node --check routes/record.mjs
          node --check routes/healthcheck.mjs
          node --check db/conn.mjs

  backend-smoke-test:
    needs: backend-build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.hello()'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: >-
            mern-project/server/package-lock.json

      - name: Install dependencies
        working-directory: mern-project/server
        run: npm ci

      - name: Start backend and run API tests
        working-directory: mern-project/server
        env:
          ATLAS_URI: mongodb://localhost:27017
          HEALTH: http://localhost:5050/api/healthcheck
        run: |
          nohup node server.mjs > server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf "$HEALTH" > /dev/null; then
              bash ../../scripts/api-test.sh
              exit $?
            fi
            sleep 2
          done
          echo "Backend did not start in 30s"
          exit 1

      - name: Show backend log on failure
        if: failure()
        working-directory: mern-project/server
        run: cat server.log

  manifest-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download kubeconform
        run: |
          V=v0.8.0
          BASE=https://github.com/yannh/kubeconform
          URL="$BASE/releases/download/$V"
          FILE=kubeconform-linux-amd64.tar.gz
          curl -sSfL "$URL/$FILE" | tar xz kubeconform

      - name: Validate Kubernetes manifests
        run: ./kubeconform -strict -summary k8s/

  image-push:
    needs:
      - frontend-build
      - backend-build
      - backend-smoke-test
      - manifest-validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: backend
            dir: mern-project/server
          - app: frontend
            dir: mern-project/client
          - app: etl
            dir: python-project
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        run: |
          OWNER="${{ github.repository_owner }}"
          NAME="${{ matrix.app }}"
          TAG="ghcr.io/$OWNER/devops-case-$NAME"
          TAG="$TAG:${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.dir }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAG }}

  manifest-update:
    needs: image-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: manifest-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update image tags in manifests
        run: |
          SHA="${GITHUB_SHA::7}"
          sed -i -E \
            "s|(devops-case-backend):.*|\1:${SHA}|" \
            k8s/backend-deployment.yaml
          sed -i -E \
            "s|(devops-case-frontend):.*|\1:${SHA}|" \
            k8s/frontend-deployment.yaml
          sed -i -E \
            "s|(devops-case-etl):.*|\1:${SHA}|" \
            k8s/etl-cronjob.yaml
          git diff

      - name: Commit and push if changed
        run: |
          BOT=github-actions[bot]
          NOREPLY=users.noreply.github.com
          git config user.name "$BOT"
          git config user.email "41898282+$BOT@$NOREPLY"
          git add k8s
          if git diff --cached --quiet; then
            echo "Tags already up to date"
          else
            MSG="k8s: imaj etiketini ${GITHUB_SHA::7} yap"
            git commit -m "$MSG [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi