# Sablon: gercek deger yazmayin ve bu dosyayi uygulamayin.
# Secret'i README'deki komutla olusturun (kullanici ve parola
# degiskenle bir kez girilir, ATLAS_URI oradan uretilir).
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: KULLANICI
  MONGO_INITDB_ROOT_PASSWORD: PAROLA
  ATLAS_URI: mongodb://KULLANICI:PAROLA@mongo:27017
