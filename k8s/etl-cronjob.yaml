apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-etl
  namespace: devops-case
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: etl
              image: ghcr.io/kortangr/devops-case-etl:0b7d840
              env:
                - name: ATLAS_URI
                  valueFrom:
                    secretKeyRef:
                      name: app-secret
                      key: ATLAS_URI
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi