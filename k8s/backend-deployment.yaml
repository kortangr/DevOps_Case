apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/kortangr/devops-case-backend:d7c079b
          ports:
            - containerPort: 5050
          env:
            - name: ATLAS_URI
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: ATLAS_URI